[project]
name = "analyst-kernel"
version = "0.0.1"
description = "Per-target kernel for Personal Analyst: runs, indexing, equations, contract checks"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.12",
    "ruff>=0.5",
]

[project.scripts]
analyst-kernel = "analyst_kernel.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "numpy>=1.26", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyst_kernel", "analyst_mpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM105", "RUF012", "SIM108", "B905", "RUF001", "RUF002", "RUF003"]
