[package]
name = "analyst-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Personal Analyst desktop workbench (Tauri 2)"

[[bin]]
name = "analyst-desktop"
path = "src/main.rs"

[lib]
name = "analyst_desktop"
path = "src/lib.rs"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
analyst-core = { path = "../../../crates/core" }
analyst-protocol = { path = "../../../crates/protocol" }
tauri = { workspace = true, features = [] }
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[features]
# Enabled by `tauri build`: embeds the frontend from `frontendDist`.
custom-protocol = ["tauri/custom-protocol"]
